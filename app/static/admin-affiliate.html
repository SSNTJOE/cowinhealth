<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Affiliate Admin</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .aff-admin { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    .aff-admin h1 { margin-bottom: 8px; }
    .aff-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .aff-grid label { margin: 0; }
    .aff-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    table.aff-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.aff-table th, table.aff-table td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
    table.aff-table .urls { color: var(--muted); font-size: 12px; }
    .aff-msg { min-height: 1.4em; color: var(--muted); }
  </style>
</head>
<body>
  <div class="aff-admin">
    <h1>Affiliate links</h1>
    <p class="note">HTTP Basic 保護。建立／編輯後可供 `/go/{slug}` 與食譜／食材 CTA 使用。</p>
    <p id="aff-msg" class="aff-msg"></p>

    <section class="card">
      <h2 id="form-title">新增 affiliate</h2>
      <input type="hidden" id="edit-id" value="" />
      <div class="aff-grid">
        <label>slug<input id="slug" /></label>
        <label>title<input id="title" /></label>
        <label>platform_name<input id="platform_name" /></label>
        <label>button_text<input id="button_text" value="前往查看優惠" /></label>
        <label>category
          <select id="category">
            <option value="diet">diet</option>
            <option value="fitness">fitness</option>
          </select>
        </label>
        <label>url_tw<input id="url_tw" /></label>
        <label>url_us<input id="url_us" /></label>
        <label>url_jp<input id="url_jp" /></label>
        <label>url_default<input id="url_default" required /></label>
      </div>
      <div class="aff-actions">
        <button type="button" id="save-btn">儲存</button>
        <button type="button" id="reset-btn" class="ghost">清空表單</button>
        <button type="button" id="reload-btn" class="secondary">重新載入列表</button>
      </div>
    </section>

    <section class="card">
      <h2>列表</h2>
      <div style="overflow-x:auto">
        <table class="aff-table">
          <thead>
            <tr>
              <th>id</th>
              <th>slug / title</th>
              <th>platform</th>
              <th>category</th>
              <th>URLs</th>
              <th>clicks</th>
              <th>active</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="aff-rows"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script>
    const msg = document.getElementById("aff-msg");
    const editId = document.getElementById("edit-id");
    const fields = ["slug","title","platform_name","button_text","category","url_tw","url_us","url_jp","url_default"];

    function setMsg(text) { msg.textContent = text || ""; }

    function formBody() {
      const body = {};
      for (const key of fields) body[key] = document.getElementById(key).value.trim();
      if (!body.category) body.category = "diet";
      return body;
    }

    function fillForm(row) {
      editId.value = row ? String(row.id) : "";
      document.getElementById("form-title").textContent = row ? `編輯 #${row.id}` : "新增 affiliate";
      for (const key of fields) {
        let fallback = "";
        if (key === "button_text") fallback = "前往查看優惠";
        if (key === "category") fallback = "diet";
        document.getElementById(key).value = row && row[key] != null ? row[key] : fallback;
      }
    }

    async function api(path, options) {
      const res = await fetch(path, Object.assign({ credentials: "same-origin" }, options || {}));
      if (res.status === 401) {
        setMsg("需要 HTTP Basic 帳密（AFFILIATE_ADMIN_USER / AFFILIATE_ADMIN_PASSWORD）");
        throw new Error("unauthorized");
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText || "request failed");
      return data;
    }

    async function loadList() {
      const data = await api("/api/admin/affiliates");
      const tbody = document.getElementById("aff-rows");
      tbody.innerHTML = (data.affiliates || []).map((row) => {
        const urls = [
          row.url_tw ? `TW ${row.url_tw}` : null,
          row.url_us ? `US ${row.url_us}` : null,
          row.url_jp ? `JP ${row.url_jp}` : null,
          row.url_default ? `DEFAULT ${row.url_default}` : null,
        ].filter(Boolean).join("<br>");
        return `<tr>
          <td>${row.id}</td>
          <td><strong>${row.slug}</strong><br>${row.title || ""}</td>
          <td>${row.platform_name || ""}<br><span class="urls">${row.button_text || ""}</span></td>
          <td>${row.category || "diet"}</td>
          <td class="urls">${urls}</td>
          <td>${row.click_count}</td>
          <td>${row.is_active ? "yes" : "no"}</td>
          <td>
            <button type="button" data-edit="${row.id}">編輯</button>
            <button type="button" class="ghost" data-toggle="${row.id}">切換</button>
          </td>
        </tr>`;
      }).join("") || `<tr><td colspan="8">尚無資料</td></tr>`;
      tbody.querySelectorAll("[data-edit]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const row = (data.affiliates || []).find((item) => String(item.id) === btn.getAttribute("data-edit"));
          if (row) fillForm(row);
        });
      });
      tbody.querySelectorAll("[data-toggle]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await api(`/api/admin/affiliates/${btn.getAttribute("data-toggle")}/toggle`, { method: "PATCH" });
            setMsg("已切換啟用狀態");
            await loadList();
          } catch (err) {
            setMsg(String(err.message || err));
          }
        });
      });
    }

    document.getElementById("reset-btn").addEventListener("click", () => fillForm(null));
    document.getElementById("reload-btn").addEventListener("click", () => loadList().catch((err) => setMsg(String(err.message || err))));
    document.getElementById("save-btn").addEventListener("click", async () => {
      try {
        const body = formBody();
        if (!body.slug || !body.title || !body.platform_name || !body.url_default) {
          setMsg("slug / title / platform_name / url_default 必填");
          return;
        }
        const id = editId.value.trim();
        if (id) {
          await api(`/api/admin/affiliates/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          setMsg(`已更新 #${id}`);
        } else {
          await api("/api/admin/affiliates", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          setMsg("已新增");
        }
        fillForm(null);
        await loadList();
      } catch (err) {
        setMsg(String(err.message || err));
      }
    });

    loadList().catch((err) => setMsg(String(err.message || err)));
  </script>
</body>
</html>
