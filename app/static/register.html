<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="registerPageTitle">註冊 — Health-ing</title>
  <link rel="stylesheet" href="/static/styles.css?v=lang-login1" />
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="registerPageTitle">建立帳號</h1>
    <p class="sub" data-i18n="registerSub">先用 E-mail 和密碼註冊並產生匿名 ID。密碼只會加密儲存；暱稱、出生年與性別下一頁再填。</p>
    <p id="mysql-status" class="status" data-i18n="mysqlChecking">正在檢查 MySQL…</p>

    <section class="card">
      <h2 data-i18n="registerFormTitle">註冊資訊</h2>
      <form id="register-form">
        <label class="js-lang-label" for="ui-lang" data-i18n="langLabel">語言</label>
        <select id="ui-lang" class="js-ui-lang" aria-label="Language">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
        <label data-i18n="emailAccount">E-mail 帳號</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />
        <label data-i18n="password">密碼</label>
        <input type="password" id="password" required minlength="6" data-i18n-placeholder="passwordMinHint" placeholder="至少 6 個字元" autocomplete="new-password" />
        <label class="hp-field" aria-hidden="true">網站網址
          <input type="text" id="website_url" name="website_url" tabindex="-1" autocomplete="off" />
        </label>
        <label for="captcha_answer" data-i18n="captcha">驗證碼</label>
        <div class="captcha-row">
          <img id="captcha-img" data-i18n-alt="captchaAlt" alt="驗證碼" width="160" height="56" />
          <button type="button" id="captcha-refresh" class="ghost" data-i18n="captchaRefresh">換一張</button>
        </div>
        <input type="hidden" id="captcha_token" value="" />
        <input type="text" id="captcha_answer" required maxlength="8" autocomplete="off" data-i18n-placeholder="captchaPlaceholder" placeholder="輸入圖片中的字元" />
        <div class="actions">
          <button type="submit" data-i18n="registerSubmit">註冊並產生匿名 ID</button>
          <a href="/"><button type="button" class="ghost" data-i18n="haveAccount">已有帳號？登入</button></a>
        </div>
      </form>
      <p id="auth-msg" class="status"></p>
    </section>
  </div>
  <script src="/static/common.js?v=lang-login1"></script>
  <script src="/static/register.js?v=lang-login1"></script>
</body>
</html>
