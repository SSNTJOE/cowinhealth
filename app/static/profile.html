<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>基本資料 — Health-ing</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="wrap">
    <h1>基本資料</h1>
    <p class="sub">補齊暱稱、出生年與性別後即可進入相機與今日狀況。E-mail 只在這一頁顯示。</p>

    <section class="card">
      <h2>帳號</h2>
      <p>匿名 ID：<span id="anon-id" class="anon"></span></p>
      <form id="profile-form">
        <label>E-mail 帳號</label>
        <input type="email" id="email" readonly />
        <label>暱稱</label>
        <input type="text" id="nickname" required maxlength="64" />
        <div class="row">
          <div>
            <label>出生年</label>
            <input type="number" id="birth_year" required min="1900" max="2026" />
          </div>
          <div>
            <label>性別</label>
            <select id="gender" required>
              <option value="">請選擇</option>
              <option value="female">女</option>
              <option value="male">男</option>
              <option value="other">其他</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button type="submit">儲存並進入主畫面</button>
          <a href="/"><button type="button" class="ghost">返回</button></a>
        </div>
      </form>
      <p id="profile-msg" class="status"></p>
    </section>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/profile.js"></script>
</body>
</html>
