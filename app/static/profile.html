<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="profilePageTitle">基本資料 — Health-ing</title>
  <link rel="stylesheet" href="/static/styles.css?v=lang-login1" />
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="profilePageTitle">基本資料</h1>
    <p class="sub" data-i18n="profileSub">補齊暱稱、出生年與性別後即可進入相機與今日狀況。E-mail 只在這一頁顯示。</p>

    <section class="card">
      <div class="lang-row">
        <label class="js-lang-label" for="ui-lang" data-i18n="langLabel">語言</label>
        <select id="ui-lang" class="js-ui-lang" aria-label="Language">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </div>
      <h2 data-i18n="accountHeading">帳號</h2>
      <p><span data-i18n="anonIdLabel">匿名 ID：</span><span id="anon-id" class="anon"></span></p>
      <form id="profile-form">
        <label data-i18n="emailAccount">E-mail 帳號</label>
        <input type="email" id="email" readonly />
        <label data-i18n="nickname">暱稱</label>
        <input type="text" id="nickname" required maxlength="64" />
        <div class="row">
          <div>
            <label data-i18n="birthYear">出生年</label>
            <input type="number" id="birth_year" required min="1900" max="2026" />
          </div>
          <div>
            <label data-i18n="gender">性別</label>
            <select id="gender" required>
              <option value="" data-i18n="genderPick">請選擇</option>
              <option value="female" data-i18n="genderFemale">女</option>
              <option value="male" data-i18n="genderMale">男</option>
              <option value="other" data-i18n="genderOther">其他</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div>
            <label data-i18n="height">身高 (cm)</label>
            <input type="number" step="0.1" id="height" />
          </div>
          <div>
            <label data-i18n="weight">體重 (kg)</label>
            <input type="number" step="0.1" id="weight" />
          </div>
        </div>
        <p id="bmi-live" class="bmi-live note"></p>
        <h3 data-i18n="conditionsHeading">特殊疾病（可複選）</h3>
        <p class="note" data-i18n="conditionsNote">教學示範用，用來篩選食療與穴道搜尋方向，不是診斷或用藥建議。</p>
        <div id="conditions-group" class="check-grid"></div>
        <h3 data-i18n="allergiesHeading">過敏（可複選）</h3>
        <p class="note" data-i18n="allergiesNote">選項來自 Recipe.xls 過敏原欄，另保留常見分類。勾選後不會推薦含這些食材的食譜。</p>
        <div id="allergies-group" class="check-grid allergies"></div>
        <div class="actions">
          <button type="submit" data-i18n="saveProfileEnter">儲存並進入主畫面</button>
          <a href="/"><button type="button" class="ghost" data-i18n="backBtn">返回</button></a>
        </div>
      </form>
      <p id="profile-msg" class="status"></p>
    </section>
  </div>
  <script src="/static/common.js?v=lang-login1"></script>
  <script src="/static/profile.js?v=lang-login1"></script>
</body>
</html>
